[project]
name = "comfyui-wiro"
description = "Run Wiro AI models in ComfyUI: category nodes with model menus from the Wiro AI catalog of 1,000+ models (text to image, image edit, upscale, background removal, text and image to video, video upscale, lipsync, text to speech, music, speech to text, 3D), an LLM node, Wiro workflow runs and the price of each run on the node, plus nodes for Nano Banana Pro, GPT Image 2, Seedream, Veo 3.1, Kling 3, Seedance and ElevenLabs. Results come back as native IMAGE, MASK, VIDEO, AUDIO, 3D and text."
version = "1.1.0"
license = { file = "LICENSE" }
requires-python = ">=3.10"
dependencies = ["requests"]
classifiers = ["Operating System :: OS Independent"]

[project.urls]
Repository = "https://github.com/wiroai/Wiro-ComfyUI"
Homepage = "https://wiro.ai"
Documentation = "https://wiro.ai/docs"
"Bug Tracker" = "https://github.com/wiroai/Wiro-ComfyUI/issues"

[tool.comfy]
PublisherId = "wiroai"
DisplayName = "Wiro AI"
Icon = "https://raw.githubusercontent.com/wiroai/Wiro-ComfyUI/main/.github/assets/icon.png"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--import-mode=importlib"
